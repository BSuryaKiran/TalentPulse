server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://127.0.0.1:5173"
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        # Authentication Service Route
        - id: auth-service-route
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**

        # Profile Service Route
        - id: profile-service-route
          uri: lb://PROFILE-SERVICE
          predicates:
            - Path=/profile/**

        # Job Service Route
        - id: job-service-route
          uri: lb://JOB-SERVICE
          predicates:
            - Path=/jobs/**

        # Application Service Route
        - id: application-service-route
          uri: lb://APPLICATION-SERVICE
          predicates:
            - Path=/applications/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud.loadbalancer: INFO
